# Análisis con SonarQube (requiere Docker Desktop abierto).
#   1) docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#      (las veces siguientes alcanza con: docker start sonarqube)
#   2) Entrar a http://localhost:9000 con admin/admin y cambiar la contraseña.
#      My Account > Security > Generate Token, tipo "Global Analysis Token".
#   3) python calidad/analizar.py          (genera coverage.xml y pylint_sonar.txt)
#   4) En PowerShell, desde la raíz del proyecto:
#      docker run --rm -e SONAR_HOST_URL="http://host.docker.internal:9000" `
#        -e SONAR_TOKEN="<TOKEN>" -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli
#   5) Ver el resultado en http://localhost:9000/dashboard?id=motor-recomendaciones
sonar.projectKey=motor-recomendaciones
sonar.projectName=Motor de recomendaciones
sonar.projectVersion=2.0.0
sonar.sources=recommender,api.py,cli.py,demo.py,benchmark.py,benchmark_archivos.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
sonar.python.coverage.reportPaths=calidad/coverage.xml
sonar.python.pylint.reportPaths=calidad/pylint_sonar.txt
# El proyecto no es un repositorio git: sin esto SonarQube avisa "SCM provider autodetection failed".
sonar.scm.disabled=true
