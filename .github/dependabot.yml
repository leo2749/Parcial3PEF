# Dependabot: PRs automáticos de actualización (seguridad y versiones).
# Cada PR pasa por el CI completo antes de poder integrarse.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    groups:
      herramientas-de-desarrollo:
        patterns: ["*"]
        exclude-patterns: ["fastapi", "uvicorn", "starlette", "pydantic*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["ci"]
